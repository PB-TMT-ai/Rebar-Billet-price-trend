name: Auto-update prices from ZIP

on:
  push:
    paths:
      - 'daily rebar prices/*.zip'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl xlrd

      - name: Find new ZIP files
        id: find_zips
        run: |
          # Get ZIP files changed in latest commit
          ZIPS=$(git diff --name-only HEAD~1 HEAD -- 'daily rebar prices/*.zip' || true)
          echo "zips<<EOF" >> $GITHUB_OUTPUT
          echo "$ZIPS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -z "$ZIPS" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Run update script for each new ZIP
        if: steps.find_zips.outputs.found == 'true'
        run: |
          echo "${{ steps.find_zips.outputs.zips }}" | while read -r zipfile; do
            if [ -n "$zipfile" ] && [ -f "$zipfile" ]; then
              echo "Processing: $zipfile"
              python scripts/update_prices.py "$zipfile"
            fi
          done

      - name: Commit and push updated Excel
        if: steps.find_zips.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "daily rebar prices/Rebar & Billet price trend (2).xlsx"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Excel with latest ZIP prices"
            git push
          fi
